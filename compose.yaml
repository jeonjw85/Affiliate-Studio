services:
  studio:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: "8787"
      STUDIO_DATA_DIR: /app/data
      STUDIO_ALLOWED_HOSTS: ${STUDIO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      AI_MODE: ${AI_MODE:-local}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_LOCAL_HOSTS: ${AI_LOCAL_HOSTS:-ollama,host.docker.internal}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-180}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-10}
      WP_URL: ${WP_URL:-}
      WP_USERNAME: ${WP_USERNAME:-}
      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-}
    ports:
      - "${STUDIO_PORT:-8787}:8787"
    volumes:
      - studio_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8787/api/state', timeout=5)); assert s['worker_running']"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    profiles: [local-ai]
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  studio_data:
  ollama_data:
